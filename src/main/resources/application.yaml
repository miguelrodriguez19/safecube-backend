server:
  port: ${PORT:8080}
  servlet:
    context-path: /safecube


spring:
  application:
    name: SafeCube Backend

  datasource:
    driver-class-name: org.postgresql.Driver
    name: ${DATABASE_NAME:safecube}
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME:safecube_app}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
      idle-timeout: 30000
      max-lifetime: 60000

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC


security:
  jwt:
    issuer: safecube
    ttl-seconds: 900
    secret: ${JWT_SECRET:change-me}
  refresh-token:
    secret: ${REFRESH_TOKEN_SECRET:change-me-refresh-secret}


springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: ${ENABLE_SWAGGER:false}


logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    org.springframework: ${LOG_LEVEL_SPRING:INFO}
    org.hibernate.SQL: OFF
    org.hibernate.orm.jdbc.bind: OFF
