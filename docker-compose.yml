volumes:
  safecube-postgres-data:

networks:
  safecube-net:
    driver: bridge

services:
  safecube:
    container_name: safecube-app
    build: .
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080

      DB_USER: safecube-user
      DB_PWD: Safecube1234
      DB_URL: jdbc:postgresql://postgres:5432/safecube
      DB_DATABASE: safecube

      JWT_SECRET: bEyD5M118jJHGUsCVEup8ZpSuOhQizha41ej8M3sqfvio
      REFRESH_TOKEN_SECRET: OaUjW2Gec0ouSWDjvwrt3gMtoAeavYsRE5Y2K1ij7Ivtc
    working_dir: /app
    depends_on:
      - postgres
    networks:
      - safecube-net

  postgres:
    image: postgres:17-alpine
    container_name: safecube-db-postgres
    ports:
      - "5436:5432"
    environment:
      POSTGRES_DB: safecube
      POSTGRES_USER: safecube-user
      POSTGRES_PASSWORD: Safecube1234
    volumes:
      - safecube-postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init-schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    networks:
      - safecube-net
