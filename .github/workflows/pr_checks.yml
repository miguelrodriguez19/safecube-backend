# .github/workflows/pr-checks.yml
name: 'Pull Request checks'

on:
  pull_request:
    branches: [ main ]

jobs:

  ############### CI + security gate (reusable workflow) ###############
  ci:
    name: 'CI / Security checks'
    permissions:
      contents: read
      pull-requests: read
      security-events: write

    uses: ./.github/workflows/ci-java-reusable.yml
    with:
      run-version-check: true
      run-security-scan: true
      run-code-scan: true


  ############### Documentation consistency check ###############
  docs-consistency-check:
    name: 'Docs consistency check (package structure)'
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make script executable
        run: chmod +x .github/scripts/check-package-structure.sh

      - name: Check package_structure.md is up to date
        run: ./.github/scripts/check-package-structure.sh
