# .github/workflows/release-main.yml
name: 'Release & Deploy (main)'

on:
  push:
    branches: [ main ]

concurrency:
  group: main-release
  cancel-in-progress: false

jobs:

  ###########################################################################
  # CI (lite): build + tests + version guard                                #
  ###########################################################################
  ci-lite:
    name: 'CI (lite)'
    permissions:
      contents: read
      pull-requests: read
      security-events: write

    uses: ./.github/workflows/ci-java-reusable.yml
    with:
      run-version-check: true
      run-security-scan: false
      run-code-scan: false


  ###########################################################################
  # Release: Maven release + Docker build & push (GHCR)                     #
  ###########################################################################
  release:
    name: 'Release artifacts'
    needs: ci-lite
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create git commits + tags + GitHub Release
      packages: write      # push image to GHCR

    steps:
      # Checkout with full history (required by Maven Release Plugin)
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Configure Git identity for Maven Release Plugin commits
      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Java 21 (+ Maven cache)
        uses: ./.github/actions/java-steps
        with:
          java-version: 21

      # -- Maven Release Plugin --
      - name: Prepare Maven release
        run: mvn -B release:prepare -DskipTests

      - name: Perform Maven release
        run: mvn -B release:perform -DskipTests

      # -- Extract released version --
      - name: Read released version
        id: version
        run: |
          VERSION=$(mvn -q \
            -Dexec.executable=echo \
            -Dexec.args='${project.version}' \
            --non-recursive \
            org.codehaus.mojo:exec-maven-plugin:3.2.0:exec)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      # -- Authenticate to GitHub Container Registry --
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -- Docker build & push --
      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest


  ###########################################################################
  # Deploy: manual approval → Render                                        #
  ###########################################################################
  deploy-render:
    name: 'Deploy to Render'
    needs: release
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Trigger Render deploy hook
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
