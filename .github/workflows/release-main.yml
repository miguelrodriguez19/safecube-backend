# .github/workflows/release-main.yml
name: 'Release & Deploy (main)'

on:
  push:
    branches: [ main ]

jobs:

  ############### 1. CI Lite (build + tests + version guard) ###############
  ci-lite:
    name: 'CI - Lite'
    permissions:
      contents: read
      pull-requests: read
      security-events: write

    uses: ./.github/workflows/ci-java-reusable.yml
    with:
      run-version-check: true
      run-security-scan: false
      run-code-scan: false
      run-acceptance-tests: false
      run-mutation-tests: false


  ############### 2. Create Git Tag ###############
  create-release-tag:
    name: 'Release - Create Git Tag'
    needs: ci-lite
    runs-on: ubuntu-latest
    permissions:
      contents: write

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Java 21 (+ Maven cache)
        uses: ./.github/actions/java-steps
        with:
          java-version: 21

      - name: Resolve release version from pom.xml
        id: version
        run: |
          RAW_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          CLEAN_VERSION=${RAW_VERSION%-SNAPSHOT}
          echo "version=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create and push Git tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"


  ############### 3. Build & Push Docker Image ###############
  build-container-image:
    name: 'Package - Build & Push Container'
    needs: create-release-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download executable JAR
        uses: actions/download-artifact@v4
        with:
          name: executable-jar
          path: target

      - name: Build & push container image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.create-release-tag.outputs.version }}
            ghcr.io/${{ github.repository }}:latest


  ############### 4. Deploy to Production (manual approval) ###############
  deploy-production:
    name: 'Deploy Production (Koyeb)'
    needs:
      - build-container-image
      - create-release-tag
    runs-on: ubuntu-latest
    environment: production

    steps:
    - name: Deploy on Koyeb
      run: |
        curl -fsSL https://raw.githubusercontent.com/koyeb/koyeb-cli/master/install.sh | sh
        export PATH="$HOME/.koyeb/bin:$PATH"

        echo "Deploying... version ${{ needs.create-release-tag.outputs.version }}"

        koyeb service update selective-charil/safecube-backend \
          --token "${{ secrets.KOYEB_API_TOKEN }}" \
          --docker ghcr.io/${{ github.repository }}:${{ needs.create-release-tag.outputs.version }} \
          --deployment-strategy immediate


  ############### 5. Create GitHub Release (after successful deploy) ###############
  create-github-release:
    name: 'Release - Create GitHub Release'
    needs:
      - deploy-production
      - create-release-tag
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.create-release-tag.outputs.version }}
          name: v${{ needs.create-release-tag.outputs.version }}
          generate_release_notes: true
