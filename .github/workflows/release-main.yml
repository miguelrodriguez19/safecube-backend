# .github/workflows/release-main.yml
name: 'Release & Deploy (main)'

on:
  push:
    branches: [ main ]

concurrency:
  group: main-release
  cancel-in-progress: false

jobs:

  ###########################################################################
  # CI (lite): build + tests + version guard                                #
  ###########################################################################
  ci-lite:
    name: 'CI (lite)'
    permissions:
      contents: read
      pull-requests: read
      security-events: write

    uses: ./.github/workflows/ci-java-reusable.yml
    with:
      run-version-check: true
      run-security-scan: false
      run-code-scan: false


  ###########################################################################
  # Release: Git tag + Docker build & push (GHCR)                           #
  ###########################################################################
  release:
    name: 'Release artifacts'
    needs: ci-lite
    runs-on: ubuntu-latest
    permissions:
      contents: write      # allow git tag push
      packages: write      # allow GHCR push

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Java 21 (+ Maven cache)
        uses: ./.github/actions/java-steps
        with:
          java-version: 21

      - name: Read and clean version from pom.xml
        id: version
        run: |
          RAW_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          CLEAN_VERSION=${RAW_VERSION%-SNAPSHOT}
          echo "version=$CLEAN_VERSION" >> "$GITHUB_OUTPUT"

      - name: Create Git tag
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository }}:latest


  ###########################################################################
  # Deploy: manual approval → Render                                        #
  ###########################################################################
  deploy-render:
    name: 'Deploy to Render'
    needs: release
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Trigger Render deploy hook
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
